################################################################################
# app-ci-cd.yaml — Azure DevOps Pipeline: App Deployment (Helm + Istio)
#
# SECRET MANAGEMENT: Azure Key Vault (AzureKeyVault@2 task)
# ─────────────────────────────────────────────────────────
# All sensitive values are fetched from Azure Key Vault at runtime.
# NO secrets are stored in Variable Groups or plain pipeline variables.
#
# Required Azure Key Vault secrets:
#   AWS-ACCESS-KEY-ID       → AWS IAM access key
#   AWS-SECRET-ACCESS-KEY   → AWS IAM secret key
#   AWS-REGION              → e.g. ap-southeast-1
#   EKS-CLUSTER-NAME        → EKS cluster name
#   APP1-IMAGE-TAG          → Nginx image tag for app1
#   APP2-IMAGE-TAG          → Nginx image tag for app2
#
# Required non-secret Variable Group (plain values only):
#   - "pipeline-config"  → AKV_NAME, AZURE_SERVICE_CONNECTION, NAMESPACE
################################################################################

trigger:
  branches:
    include: [feature/*, main]
  paths:
    include:
      - kubernetes/**
      - pipelines/app-ci-cd.yaml

pr:
  branches:
    include: [main]
  paths:
    include: [kubernetes/**]

variables:
  # ── Non-secret pipeline config only ────────────────────────────────────────
  - group: pipeline-config            # AKV_NAME, AZURE_SERVICE_CONNECTION, NAMESPACE
  - name: HELM_VERSION
    value: "3.14.4"
  - name: KUBECTL_VERSION
    value: "1.29.0"
  - name: CHART_PATH
    value: "$(Build.SourcesDirectory)/kubernetes/helm/microservice"
  - name: ISTIO_PATH
    value: "$(Build.SourcesDirectory)/kubernetes/istio"

pool:
  vmImage: "ubuntu-22.04"

stages:
  ############################################################################
  # STAGE 1: SECURITY SCAN — Gitleaks + Helm lint (no secrets needed)
  ############################################################################
  - stage: SecurityScan
    displayName: "Security Scan (Gitleaks + Helm Lint)"
    jobs:
      - job: Gitleaks
        displayName: "Gitleaks Secrets Detection"
        steps:
          - checkout: self
            fetchDepth: 0
          - script: |
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
                | tar -xz -C /usr/local/bin gitleaks
              gitleaks detect \
                --source="$(Build.SourcesDirectory)" \
                --config="$(Build.SourcesDirectory)/.gitleaks.toml" \
                --report-path="$(Build.ArtifactStagingDirectory)/gitleaks-report.json" \
                --report-format=json \
                --exit-code=1
            displayName: "Gitleaks Scan"
          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)/gitleaks-report.json"
              artifactName: "security-reports"

      - job: HelmLint
        displayName: "Helm Lint"
        steps:
          - checkout: self
          - script: |
              curl -fsSL https://get.helm.sh/helm-v$(HELM_VERSION)-linux-amd64.tar.gz | tar -xz
              sudo mv linux-amd64/helm /usr/local/bin/
              helm lint $(CHART_PATH) --values $(CHART_PATH)/values.yaml --strict
            displayName: "Helm Lint Chart"

  ############################################################################
  # STAGE 2: DEPLOY ISTIO — fetch KV secrets, apply Gateway + VirtualService
  ############################################################################
  - stage: DeployIstio
    displayName: "Deploy Istio Gateway + VirtualService"
    dependsOn: SecurityScan
    condition: succeeded()
    jobs:
      - deployment: IstioConfig
        displayName: "Apply Istio CRDs"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # ── Fetch secrets from Azure Key Vault ─────────────────────
                - task: AzureKeyVault@2
                  displayName: "Fetch secrets from Azure Key Vault"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    KeyVaultName: "$(AKV_NAME)"
                    SecretsFilter: "AWS-ACCESS-KEY-ID,AWS-SECRET-ACCESS-KEY,AWS-REGION,EKS-CLUSTER-NAME"
                    RunAsPreJob: false

                - script: |
                    # Install kubectl
                    curl -LO "https://dl.k8s.io/release/v$(KUBECTL_VERSION)/bin/linux/amd64/kubectl"
                    chmod +x kubectl && sudo mv kubectl /usr/local/bin/

                    # Install AWS CLI
                    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                    unzip -q awscliv2.zip && sudo ./aws/install

                    # Configure kubeconfig using KV-sourced values
                    aws eks update-kubeconfig \
                      --region $(AWS-REGION) \
                      --name $(EKS-CLUSTER-NAME)
                  displayName: "Setup kubectl + kubeconfig"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)
                    AWS_DEFAULT_REGION: $(AWS-REGION)

                - script: |
                    kubectl apply -f $(ISTIO_PATH)/gateway.yaml
                    echo "Waiting 10s for Gateway to be ready..."
                    sleep 10
                    kubectl apply -f $(ISTIO_PATH)/virtualservice.yaml

                    echo "── Verification ──"
                    kubectl get gateway -n istio-system
                    kubectl get virtualservice -n default
                    kubectl get destinationrule -n default
                  displayName: "Apply Istio Gateway + VirtualService"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)

  ############################################################################
  # STAGE 3: DEPLOY APPS — Helm upgrade app1 + app2
  ############################################################################
  - stage: DeployApps
    displayName: "Deploy app1 + app2 via Helm"
    dependsOn: DeployIstio
    condition: succeeded()
    jobs:
      - deployment: DeployApp1
        displayName: "Helm deploy app1"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # ── Fetch ALL required secrets ──────────────────────────────
                - task: AzureKeyVault@2
                  displayName: "Fetch secrets from Azure Key Vault"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    KeyVaultName: "$(AKV_NAME)"
                    SecretsFilter: "AWS-ACCESS-KEY-ID,AWS-SECRET-ACCESS-KEY,AWS-REGION,EKS-CLUSTER-NAME,APP1-VALUES-YAML"
                    RunAsPreJob: false

                - script: |
                    # Install tools
                    curl -fsSL https://get.helm.sh/helm-v$(HELM_VERSION)-linux-amd64.tar.gz | tar -xz
                    sudo mv linux-amd64/helm /usr/local/bin/
                    curl -LO "https://dl.k8s.io/release/v$(KUBECTL_VERSION)/bin/linux/amd64/kubectl"
                    chmod +x kubectl && sudo mv kubectl /usr/local/bin/
                    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                    unzip -q awscliv2.zip && sudo ./aws/install

                    # Configure kubeconfig with KV-sourced values
                    aws eks update-kubeconfig --region $(AWS-REGION) --name $(EKS-CLUSTER-NAME)
                  displayName: "Setup Tools + kubeconfig"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)
                    AWS_DEFAULT_REGION: $(AWS-REGION)

                - script: |
                    # Write the values.yaml payload from Key Vault secret to local file
                    cat << 'EOF' > app1-values-override.yaml
$(APP1-VALUES-YAML)
EOF

                    # Verify that a valid values.yaml file was created
                    if [ ! -s app1-values-override.yaml ]; then
                      echo "❌ Error: APP1-VALUES-YAML secret from Key Vault is empty or not found!"
                      exit 1
                    fi
                    echo "✅ Created app1-values-override.yaml successfully"

                    # helm-diff plugin for drift detection
                    helm plugin install https://github.com/databus23/helm-diff 2>/dev/null || true

                    # Drift check — show what would change
                    helm diff upgrade app1 $(CHART_PATH) \
                      --namespace $(NAMESPACE) \
                      -f app1-values-override.yaml \
                      || true

                    # Deploy app1 using values.yaml retrieved from Key Vault
                    helm upgrade --install app1 $(CHART_PATH) \
                      --namespace $(NAMESPACE) \
                      --create-namespace \
                      -f app1-values-override.yaml \
                      --atomic \
                      --timeout 5m \
                      --wait

                    kubectl rollout status deployment/app1 -n $(NAMESPACE) --timeout=5m
                  displayName: "Helm Deploy app1 (values.yaml from AKV)"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)

      - deployment: DeployApp2
        displayName: "Helm deploy app2"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureKeyVault@2
                  displayName: "Fetch secrets from Azure Key Vault"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    KeyVaultName: "$(AKV_NAME)"
                    SecretsFilter: "AWS-ACCESS-KEY-ID,AWS-SECRET-ACCESS-KEY,AWS-REGION,EKS-CLUSTER-NAME,APP2-VALUES-YAML"
                    RunAsPreJob: false

                - script: |
                    curl -fsSL https://get.helm.sh/helm-v$(HELM_VERSION)-linux-amd64.tar.gz | tar -xz
                    sudo mv linux-amd64/helm /usr/local/bin/
                    curl -LO "https://dl.k8s.io/release/v$(KUBECTL_VERSION)/bin/linux/amd64/kubectl"
                    chmod +x kubectl && sudo mv kubectl /usr/local/bin/
                    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                    unzip -q awscliv2.zip && sudo ./aws/install
                    aws eks update-kubeconfig --region $(AWS-REGION) --name $(EKS-CLUSTER-NAME)
                  displayName: "Setup Tools + kubeconfig"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)
                    AWS_DEFAULT_REGION: $(AWS-REGION)

                - script: |
                    # Write the values.yaml payload from Key Vault secret to local file
                    cat << 'EOF' > app2-values-override.yaml
$(APP2-VALUES-YAML)
EOF

                    # Verify that a valid values.yaml file was created
                    if [ ! -s app2-values-override.yaml ]; then
                      echo "❌ Error: APP2-VALUES-YAML secret from Key Vault is empty or not found!"
                      exit 1
                    fi
                    echo "✅ Created app2-values-override.yaml successfully"

                    # helm-diff plugin for drift detection
                    helm plugin install https://github.com/databus23/helm-diff 2>/dev/null || true

                    # Drift check — show what would change
                    helm diff upgrade app2 $(CHART_PATH) \
                      --namespace $(NAMESPACE) \
                      -f app2-values-override.yaml \
                      || true

                    # Deploy app2 using values.yaml retrieved from Key Vault
                    helm upgrade --install app2 $(CHART_PATH) \
                      --namespace $(NAMESPACE) \
                      --create-namespace \
                      -f app2-values-override.yaml \
                      --atomic \
                      --timeout 5m \
                      --wait

                    kubectl rollout status deployment/app2 -n $(NAMESPACE) --timeout=5m
                  displayName: "Helm Deploy app2 (values.yaml from AKV)"
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)

  ############################################################################
  # STAGE 4: SMOKE TEST
  ############################################################################
  - stage: SmokeTest
    displayName: "Smoke Test (/app1 + /app2)"
    dependsOn: DeployApps
    condition: succeeded()
    jobs:
      - job: SmokeTest
        steps:
          - checkout: self

          # ── Fetch minimal secrets for smoke test ──────────────────────────
          - task: AzureKeyVault@2
            displayName: "Fetch secrets from Azure Key Vault"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              KeyVaultName: "$(AKV_NAME)"
              SecretsFilter: "AWS-ACCESS-KEY-ID,AWS-SECRET-ACCESS-KEY,AWS-REGION,EKS-CLUSTER-NAME"
              RunAsPreJob: false

          - script: |
              curl -LO "https://dl.k8s.io/release/v$(KUBECTL_VERSION)/bin/linux/amd64/kubectl"
              chmod +x kubectl && sudo mv kubectl /usr/local/bin/
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
              unzip -q awscliv2.zip && sudo ./aws/install
              aws eks update-kubeconfig --region $(AWS-REGION) --name $(EKS-CLUSTER-NAME)

              echo "── Pod status ──"
              kubectl get pods -n $(NAMESPACE) -l release=app1
              kubectl get pods -n $(NAMESPACE) -l release=app2

              # Get Istio Ingress Gateway External IP/hostname
              INGRESS_HOST=$(kubectl get svc istio-ingressgateway -n istio-system \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
                kubectl get svc istio-ingressgateway -n istio-system \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              echo "Istio Ingress: $INGRESS_HOST"

              # Retry smoke tests
              for i in 1 2 3 4 5; do
                curl -sf "http://$INGRESS_HOST/app1/" && echo "✅ /app1 OK" && break || sleep 15
              done
              for i in 1 2 3 4 5; do
                curl -sf "http://$INGRESS_HOST/app2/" && echo "✅ /app2 OK" && break || sleep 15
              done
            displayName: "Smoke Test /app1 + /app2"
            env:
              AWS_ACCESS_KEY_ID: $(AWS-ACCESS-KEY-ID)
              AWS_SECRET_ACCESS_KEY: $(AWS-SECRET-ACCESS-KEY)
              AWS_DEFAULT_REGION: $(AWS-REGION)

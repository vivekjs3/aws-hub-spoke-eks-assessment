appName: microservice-stub
environment: dev-sandbox

image:
  repository: nginx
  tag: "1.27.0-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  protocol: TCP

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

istio:
  enabled: true
  sidecarInjection: true

################################################################################
# values.yaml — Safe Generic Stub (Public Git Repository)
#
# SECURITY COMPLIANCE WARNING:
#   To prevent configuration leakages and enforce strict DevSecOps boundaries,
#   DO NOT store environment-specific or sensitive configurations in this file.
#
#   All real values.yaml configurations for app1 and app2 are pulled dynamically
#   at deployment runtime from Azure Key Vault (secrets: APP1-VALUES-YAML and
#   APP2-VALUES-YAML) and applied using -f flags in the CI/CD pipeline.
#
#   This stub contains only minimal safe defaults required for local linting.
